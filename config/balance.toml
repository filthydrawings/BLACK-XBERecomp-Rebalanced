# Balance sheet: edit the numbers here.
# The game reads balance.toml beside BLACK.exe once, when the first level loads: restart the game after editing.
# The build copies config/balance.toml there, so edit config/ and rebuild, or edit the copy beside the exe.
# Hits are body hits to kill, 0 = no damage; headshots still kill instantly. Easy uses [normal].
# Each part applies only with its toggle on, in the game's Recomp Settings > Balancing Settings (or F10), and the
# toggles take effect at once: Enemy rebalancing (the hits tables), Per difficulty enemy rebalancing (off, every
# difficulty uses [normal]), Realistic clip sizes (clip), Weapon range adjustments (range), Recoil adjustments
# (recoil). A clip change shows from the next reload or pickup.
#
# HITS TO KILL
# One row per enemy type, one number per weapon: how many body hits that weapon needs to kill that enemy.
# The game stores each as a share of health per hit, 1.02 / hits. Headshot kills are a separate rule.
# 0 means the weapon does no damage to that enemy.
# Each row lists the weapons in this order:
#   dc3elite, spas12, sniper, uzi, g36c, ak47, mac10, p90, m249, magnum, m16, rem870, glock, mp5
# (the RPG and grenade launcher are left out: explosions use other code)
#
# "_back" rows: hits from behind, where they differ from the front. Without one, the front row counts for both.
#
# Enemy types, from the logs:
#   type_37  standard soldier
#   type_39  standard variant
#   type_41  armoured
#   type_42  heavier armour
#   type_38  the tough one (headshot kills only from behind)
#   type_40  shield: almost immune from the front, 1 or 2 hits from behind
#   type_43  takes no damage (hostage or scripted), left out
#
# Easy (difficulty 0) uses the Normal table.
# All three tables start as the game's own values: today every difficulty uses the same ones.

