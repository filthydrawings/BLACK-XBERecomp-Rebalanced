# WEAPON STATS, from the game's weapon records (assets\GlobData.bin)
#   clip      confirmed by your tests
#   ammo      which guns share an ammo pool (shown for reference, change with care)
#   range     record +0x14, unconfirmed: 25 shotguns, 30 Uzi/MAC10/P90, 60 most guns, 1000 long range.
#             Applied with Weapon range adjustments
#   recoil    record +0x68, confirmed: the kick of each shot, higher kicks more. Applied with Recoil adjustments
#   reload    reload speed multiplier, 1.0 = the game's, 2.0 = twice as fast. NOT APPLIED YET: the reload timing
#             and animation fields are still being researched
#   the fire interval (record +0x20, seconds between shots) is not editable on purpose: a change puts the
#   weapon's animations out of step with its shots
#   spread: candidate fields found, not confirmed yet, so not listed here
